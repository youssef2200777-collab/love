<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE YOU.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Montserrat',sans-serif; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

  .center-overlay { position:absolute; top:50%; left:50%; z-index:10; pointer-events:none; }
  /* outer = JS tilt, inner = CSS pulse (separate so they don't override each other) */
  .tilt { transform:translate(-50%,-50%); }
  .heart-text {
    color:#fff; font-weight:900; letter-spacing:6px;
    font-size:clamp(1.6rem,5vw,4.5rem); white-space:nowrap;
    opacity:0; transition:opacity .6s ease-in-out;
    text-shadow:0 0 10px rgba(255,20,147,.9),0 0 20px rgba(255,20,147,.8),0 0 40px rgba(255,20,147,.9),0 0 80px rgba(255,0,100,1);
    animation:pulseGlow 2s infinite alternate ease-in-out;
  }
  .heart-text.visible { opacity:1; }
  @keyframes pulseGlow { from{transform:scale(.96)} to{transform:scale(1.04)} }

  .start-modal {
    position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.88);
    backdrop-filter:blur(12px); display:flex; justify-content:center; align-items:center;
    cursor:pointer; transition:opacity .8s ease, visibility .8s ease; text-align:center;
  }
  .start-modal.hidden-modal { opacity:0; visibility:hidden; pointer-events:none; }
  .start-modal svg { width:64px; height:64px; fill:#ec4899; filter:drop-shadow(0 0 15px rgba(255,20,147,.8)); margin-bottom:16px; animation:beat 1s infinite; }
  @keyframes beat { 50%{transform:scale(1.2)} }
  .start-modal p { color:#f9a8d4; font-weight:700; letter-spacing:.2em; font-size:1.1rem; }

</style>
</head>
<body>

<div id="startModal" class="start-modal">
  <div>
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <p>CLICK ANYWHERE TO START</p>
  </div>
</div>


<canvas id="c"></canvas>

<div class="center-overlay">
  <div class="tilt" id="tilt"><div id="centerText" class="heart-text">LOVE YOU.</div></div>
</div>

<!-- Put your own song next to this file and name it song.mp3 (first source wins) -->
<audio id="bgAudio" loop preload="auto">
  <source src="song.mp3" type="audio/mpeg">
  <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Trio_TOC/Lo-Fi_Chill/Trio_TOC_-_Love_Theme.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tilt = document.getElementById('tilt');
const centerText = document.getElementById('centerText');
const startModal = document.getElementById('startModal');
const audio = document.getElementById('bgAudio');
audio.volume = 0.8;

let W, H;
const mouse = { x:0, y:0, tx:0, ty:0, tiltX:0, tiltY:0, vx:0, vy:0 };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  mouse.x = mouse.tx = mouse.x || W/2;
  mouse.y = mouse.ty = mouse.y || H/2;
  initHeartPoints();
}
window.addEventListener('resize', resize);

/* ---------- pointer ---------- */
function pointer(e) {
  const p = e.touches ? e.touches[0] : e;
  if (!p) return;
  mouse.tx = p.clientX; mouse.ty = p.clientY;
  mouse.tiltX = (p.clientX / W - .5) * 2;
  mouse.tiltY = (p.clientY / H - .5) * 2;
}
window.addEventListener('mousemove', pointer);
window.addEventListener('touchmove', pointer, { passive:true });
window.addEventListener('touchstart', pointer, { passive:true });

/* ---------- floating hearts (react to mouse) ---------- */
function heartPath(c, s) {
  c.beginPath();
  c.moveTo(0, s*.35);
  c.bezierCurveTo(-s*1.1, -s*.35, -s*.55, -s*1.05, 0, -s*.4);
  c.bezierCurveTo(s*.55, -s*1.05, s*1.1, -s*.35, 0, s*.35);
  c.closePath();
}

class FloatingHeart {
  constructor(initial) { this.reset(initial); }
  reset(initial) {
    this.x = Math.random() * W;
    this.y = initial ? Math.random() * H : H + 30;
    this.size = Math.random() * 9 + 5;
    this.vx = 0; this.vy = 0;
    this.rise = Math.random() * .8 + .3;
    this.phase = Math.random() * 6.28;
    this.rot = (Math.random() - .5) * .6;
    this.rotV = 0;
    this.alpha = Math.random() * .6 + .3;
    this.hue = 325 + Math.random() * 30;
  }
  update() {
    // gentle rise + sway
    this.phase += .02;
    this.vy -= this.rise * .02;
    this.vx += Math.sin(this.phase) * .01;

    // mouse repel / swirl
    const dx = this.x - mouse.x, dy = this.y - mouse.y;
    const d = Math.hypot(dx, dy) || 1;
    const R = 170;
    if (d < R) {
      const f = (1 - d / R);
      this.vx += (dx / d) * f * 2.2 + (-dy / d) * f * .6;
      this.vy += (dy / d) * f * 2.2 + (dx / d) * f * .6;
      this.rotV += (Math.random() - .5) * .08 * f;
    }
    this.vx *= .94; this.vy *= .94; this.rotV *= .95;
    this.x += this.vx; this.y += this.vy + -this.rise * .6;
    this.rot += this.rotV;

    if (this.y < -40 || this.x < -60 || this.x > W + 60) this.reset(false);
  }
  draw() {
    const d = Math.hypot(this.x - mouse.x, this.y - mouse.y);
    const near = d < 170;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = near ? 1 : this.alpha;
    ctx.fillStyle = near ? '#ffd1e8' : `hsl(${this.hue},100%,62%)`;
    ctx.shadowColor = `hsl(${this.hue},100%,50%)`;
    ctx.shadowBlur = near ? 22 : 12;
    heartPath(ctx, near ? this.size * 1.25 : this.size);
    ctx.fill();
    ctx.restore();
  }
}
const hearts = [];

/* ---------- heart made of text ---------- */
let heartPoints = [];
const phrase = "I LOVE YOU ";
let progress = 0, pulseAngle = 0;

function heartEq(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))
  };
}
function initHeartPoints() {
  heartPoints = [];
  const N = 320, scale = Math.min(W, H) / 38;
  for (let i = 0; i < N; i++) {
    const t = (i / N) * Math.PI * 2 - Math.PI * 1.5;
    const p = heartEq(t), q = heartEq(t + .01);
    heartPoints.push({
      bx: p.x * scale, by: p.y * scale,
      angle: Math.atan2(q.y - p.y, q.x - p.x),
      ch: phrase[i % phrase.length],
      ox: 0, oy: 0            // spring offset
    });
  }
}

/* ---------- audio ---------- */
let playing = false, useSynth = false;
function setBtn() {}

/* Built-in romantic melody (Web Audio) – used automatically when song.mp3 / the online link fail to load */
let actx = null, master = null, synthTimer = null, bar = 0;
const N = { A3:220, C4:261.63, D4:293.66, E4:329.63, F3:174.61, G3:196, G4:392, A4:440, B3:246.94, C5:523.25, E5:659.25, F4:349.23, D5:587.33 };
const chords = [
  [N.A3, N.C4, N.E4],   // Am
  [N.F3, N.A3, N.C4],   // F
  [N.C4, N.E4, N.G4],   // C
  [N.G3, N.B3, N.D4]    // G
];
const arps = [
  [N.A4, N.C5, N.E5, N.C5, N.A4, N.E4, N.A4, N.C5],
  [N.A4, N.C5, N.F4 * 2, N.C5, N.A4, N.F4, N.A4, N.C5],
  [N.G4, N.C5, N.E5, N.C5, N.G4, N.E4, N.G4, N.C5],
  [N.G4, N.B3 * 2, N.D5, N.B3 * 2, N.G4, N.D4, N.G4, N.B3 * 2]
];
function tone(freq, t0, dur, vol, type) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function scheduleBar() {
  const t0 = actx.currentTime + 0.05, beat = 0.7;   // ~86 bpm
  const i = bar % 4; bar++;
  chords[i].forEach(f => tone(f, t0, beat * 4, 0.10, 'sine'));
  arps[i].forEach((f, k) => tone(f, t0 + k * beat / 2, beat * 1.2, 0.09, 'triangle'));
}
function startSynth() {
  ensureCtx();
  return actx.resume().then(() => {
    if (actx.state !== 'running') return false;
    if (!synthTimer) { scheduleBar(); synthTimer = setInterval(scheduleBar, 2800); }
    return true;
  }).catch(() => false);
}
function stopSynth() { clearInterval(synthTimer); synthTimer = null; if (actx) actx.suspend(); }

let wantOn = false, fallbackTimer = null;

// create + unlock the Web Audio context (must be called from a real click/tap)
function ensureCtx() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume().catch(() => {});
}

function play() {
  wantOn = true;
  ensureCtx();

  if (useSynth) {
    return startSynth().then(ok => { playing = ok; setBtn(); return ok; });
  }

  // if the real song doesn't actually start within 8s, switch to the built-in melody
  clearTimeout(fallbackTimer);
  fallbackTimer = setTimeout(() => {
    if (wantOn && !useSynth && (audio.paused || audio.readyState < 3)) {
      useSynth = true; audio.pause(); play();
    }
  }, 8000);

  return audio.play().then(() => { playing = true; setBtn(); return true; })
    .catch(err => {
      if (err && err.name === 'NotAllowedError') {   // blocked until the first click
        wantOn = false; clearTimeout(fallbackTimer); playing = false; setBtn(); return false;
      }
      useSynth = true; return play();                // missing / unsupported file → built-in melody
    });
}
function pause() {
  wantOn = false; clearTimeout(fallbackTimer);
  audio.pause(); stopSynth(); playing = false; setBtn();
}

// if the last <source> fails to load, no real song is available → switch to the built-in melody
const srcs = audio.querySelectorAll('source');
srcs[srcs.length - 1].addEventListener('error', () => {
  useSynth = true;
  if (wantOn) play();
});
let gestureDone = false;


function hideModal() { startModal.classList.add('hidden-modal'); }

// 1) try to start immediately on page open
play().then(ok => { if (ok) hideModal(); });

// 2) browsers block sound until the first click/tap/key, so start on that first gesture
const gestureEvents = ['pointerdown','touchstart','touchend','keydown','click'];
function stopListening() { gestureEvents.forEach(ev => window.removeEventListener(ev, firstGesture)); }
function firstGesture() {
  gestureDone = true;
  if (playing) { hideModal(); stopListening(); return; }
  // keep listening until the sound has really started (phones often reject the first try)
  play().then(ok => { if (ok) { hideModal(); stopListening(); } });
}
gestureEvents.forEach(ev => window.addEventListener(ev, firstGesture));

/* ---------- main loop ---------- */
function render() {
  ctx.clearRect(0, 0, W, H);

  mouse.x += (mouse.tx - mouse.x) * .12;
  mouse.y += (mouse.ty - mouse.y) * .12;

  hearts.forEach(h => { h.update(); h.draw(); });

  if (progress < 1) {
    progress = Math.min(1, progress + .012);
    if (progress > .3) centerText.classList.add('visible');
  }

  pulseAngle += .035;
  const pulse = 1 + Math.sin(pulseAngle) * .035;
  const cx = W / 2, cy = H / 2 - 10;
  const count = Math.floor(heartPoints.length * progress);

  tilt.style.transform =
    `translate(-50%,-50%) translate3d(${mouse.tiltX*18}px,${mouse.tiltY*18}px,0) rotateX(${-mouse.tiltY*12}deg) rotateY(${mouse.tiltX*12}deg)`;

  ctx.font = '900 11px Montserrat, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const R = 180;
  for (let i = 0; i < count; i++) {
    const p = heartPoints[i];
    const px = p.bx * pulse, py = p.by * pulse;
    const ax = cx + px, ay = cy + py;

    const dx = mouse.x - ax, dy = mouse.y - ay;
    const d = Math.hypot(dx, dy) || 1;
    const near = d < R;

    // spring: letters get pushed away from the cursor and bounce back
    if (near) {
      const f = (1 - d / R) * 3;
      p.ox -= (dx / d) * f;
      p.oy -= (dy / d) * f;
    }
    p.ox *= .9; p.oy *= .9;

    const fx = ax + p.ox + mouse.tiltX * 14;
    const fy = ay + p.oy + mouse.tiltY * 14;

    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(p.angle + (near ? (1 - d / R) * .8 : 0));
    ctx.shadowColor = '#ff1493';
    ctx.shadowBlur = near ? 20 : 10;
    ctx.fillStyle = near ? '#fff' : '#ff69b4';
    ctx.fillText(p.ch, 0, 0);
    ctx.restore();
  }
  requestAnimationFrame(render);
}

// make sure the font is ready before the canvas uses it
(document.fonts && document.fonts.load ? document.fonts.load("900 11px Montserrat") : Promise.resolve())
  .catch(() => {})
  .then(() => {
    resize();
    for (let i = 0; i < 70; i++) hearts.push(new FloatingHeart(true));
    requestAnimationFrame(render);
  });
</script>
</body>
</html>
